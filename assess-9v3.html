<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Academic Support App</title>
<style>
:root{--primary:#3f51b5;--primary-dark:#2c3a8c;--accent:#ff9800;--ok:#2e9e5b;--bad:#e5484d;--bg:#f2f4fb;--card:#fff;--text:#1f2433;--muted:#6b7280;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Roboto,Arial,sans-serif}
body{background:#dfe3f3;min-height:100vh;display:flex;justify-content:center;align-items:center;color:var(--text)}
.phone{width:100%;max-width:400px;height:100vh;max-height:760px;background:var(--bg);display:flex;flex-direction:column;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
@media(max-width:430px){body{display:block}.phone{height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}input,select,textarea{font-size:16px}}
header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:18px 20px 22px;border-radius:0 0 24px 24px}
header h1{font-size:20px}header p{font-size:13px;opacity:.85;margin-top:2px}
main{flex:1;overflow-y:auto;padding:16px}
.screen{display:none}.screen.active{display:block}
h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,40,90,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center;cursor:pointer}.stat .ico{font-size:24px}.stat .num{font-size:24px;font-weight:700;color:var(--primary)}.stat small{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:12px}
.bar{height:8px;background:#e5e8f3;border-radius:8px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;color:#fff;font-weight:600}
.ok{background:var(--ok)}.bad{background:var(--bad)}.warn{background:var(--accent)}
form{display:flex;flex-direction:column;gap:8px}
input,select,textarea{padding:10px 12px;border:1px solid #d5d9ea;border-radius:10px;font-size:14px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);border-color:transparent}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{background:var(--primary-dark)}.btn.sm{padding:6px 10px;font-size:12px}
.btn.green{background:var(--ok)}.btn.red{background:var(--bad)}.btn.ghost{background:#eceffb;color:var(--primary)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{padding:7px 14px;border-radius:20px;background:#fff;border:1px solid #d5d9ea;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs .chip{flex:1;text-align:center}
.done .title{text-decoration:line-through;color:var(--muted)}
.unread{border-left:4px solid var(--accent)}
.empty{text-align:center;color:var(--muted);padding:20px;font-size:14px}
nav{display:flex;background:#fff;border-top:1px solid #e5e8f3;padding:6px 0}
nav button{flex:1;background:none;border:none;padding:6px 0;font-size:10px;color:var(--muted);cursor:pointer;position:relative}
nav button span{display:block;font-size:20px}nav button.active{color:var(--primary);font-weight:700}
.badge{position:absolute;top:0;right:22%;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
</style>
</head>
<body>
<div class="phone">
  <header><h1 id="hTitle">Dashboard</h1><p id="hSub"></p></header>
  <main>
    <section class="screen active" id="dashboard"></section>
    <section class="screen" id="attendance"></section>
    <section class="screen" id="assignments"></section>
    <section class="screen" id="timetable"></section>
    <section class="screen" id="notifications"></section>
  </main>
  <nav id="nav"></nav>
</div>

<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
const todayIdx=(new Date().getDay()+6)%7;
let S={name:"Student",att:[{n:"Mathematics",a:18,t:22},{n:"Physics",a:14,t:20},{n:"Programming",a:20,t:21}],
 asg:[{t:"Calculus worksheet",s:"Mathematics",d:fmt(addDays(2)),done:false},{t:"Lab report 3",s:"Physics",d:fmt(addDays(5)),done:false}],
 tt:[{day:"Mon",time:"09:00",sub:"Mathematics",room:"A-101"},{day:"Mon",time:"11:00",sub:"Physics",room:"Lab 2"},{day:"Tue",time:"10:00",sub:"Programming",room:"C-204"}],
 nt:[{m:"Welcome! Add your attendance, assignments and timetable.",time:"Now",read:false}]};
let ui={screen:"dashboard",day:DAYS[Math.min(todayIdx,5)],tab:"pending"};
try{const x=JSON.parse(localStorage.getItem("sas"));if(x)S=x}catch(e){}
function save(){try{localStorage.setItem("sas",JSON.stringify(S))}catch(e){}}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d}
function fmt(d){return d.toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function daysLeft(d){const a=new Date(fmt(new Date())),b=new Date(d);return Math.round((b-a)/864e5)}
function pct(x){return x.t?Math.round(x.a/x.t*100):0}
function color(p){return p>=75?"var(--ok)":p>=60?"var(--accent)":"var(--bad)"}
function notify(m){S.nt.unshift({m,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),read:false})}
const $=id=>document.getElementById(id);
const NAV=[["dashboard","🏠","Home"],["attendance","📊","Attendance"],["assignments","📝","Tasks"],["timetable","📅","Timetable"],["notifications","🔔","Alerts"]];
const SUB={dashboard:"Welcome back",attendance:"Track your classes",assignments:"Assignment deadlines",timetable:"Weekly schedule",notifications:"Academic notifications"};
const TITLE={dashboard:"Dashboard",attendance:"Attendance",assignments:"Assignments",timetable:"Timetable",notifications:"Notifications"};

function go(s){ui.screen=s;render()}
function render(){
  document.querySelectorAll(".screen").forEach(e=>e.classList.toggle("active",e.id===ui.screen));
  $("hTitle").textContent=TITLE[ui.screen];
  $("hSub").textContent=ui.screen==="dashboard"?"Hello, "+S.name+" 👋":SUB[ui.screen];
  const unread=S.nt.filter(n=>!n.read).length;
  $("nav").innerHTML=NAV.map(n=>`<button class="${ui.screen===n[0]?"active":""}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}${n[0]==="notifications"&&unread?`<b class="badge">${unread}</b>`:""}</button>`).join("");
  ({dashboard,attendance,assignments,timetable,notifications})[ui.screen]();
  save();
}

function dashboard(){
  const T=S.att.reduce((a,x)=>a+x.t,0),A=S.att.reduce((a,x)=>a+x.a,0),ov=T?Math.round(A/T*100):0;
  const pend=S.asg.filter(a=>!a.done).sort((a,b)=>a.d.localeCompare(b.d));
  const today=S.tt.filter(x=>x.day===DAYS[todayIdx]).length;
  const unread=S.nt.filter(n=>!n.read).length;
  $("dashboard").innerHTML=`
  <div class="grid">
    <div class="card stat" onclick="go('attendance')"><div class="ico">📊</div><div class="num" style="color:${color(ov)}">${ov}%</div><small>Overall attendance</small></div>
    <div class="card stat" onclick="go('assignments')"><div class="ico">📝</div><div class="num">${pend.length}</div><small>Pending tasks</small></div>
    <div class="card stat" onclick="go('timetable')"><div class="ico">📅</div><div class="num">${today}</div><small>Classes today</small></div>
    <div class="card stat" onclick="go('notifications')"><div class="ico">🔔</div><div class="num">${unread}</div><small>Unread alerts</small></div>
  </div>
  <h2>⏰ Next deadline</h2>
  ${pend.length?`<div class="card"><div class="row"><b>${esc(pend[0].t)}</b>${dueTag(pend[0].d)}</div><div class="muted">${esc(pend[0].s)} · Due ${pend[0].d}</div></div>`:`<div class="card empty">No pending assignments 🎉</div>`}
  ${ov<75&&T?`<div class="card" style="border-left:4px solid var(--bad)">⚠️ Overall attendance is below 75%.</div>`:""}
  <h2>👤 Profile</h2>
  <div class="card"><form onsubmit="event.preventDefault();S.name=this.nm.value.trim()||'Student';render()">
    <input name="nm" placeholder="Enter your name" value="${esc(S.name)}"><button class="btn">Update name</button></form></div>`;
}
function dueTag(d){const n=daysLeft(d);return n<0?`<span class="tag bad">Overdue</span>`:n<=2?`<span class="tag warn">${n===0?"Today":n+"d left"}</span>`:`<span class="tag ok">${n}d left</span>`}

function attendance(){
  $("attendance").innerHTML=(S.att.length?S.att.map((x,i)=>{const p=pct(x);return `<div class="card">
    <div class="row"><b>${esc(x.n)}</b><span class="tag" style="background:${color(p)}">${p}%</span></div>
    <div class="bar"><i style="width:${p}%;background:${color(p)}"></i></div>
    <div class="row"><span class="muted">${x.a} / ${x.t} classes attended</span>
    <span><button class="btn sm green" onclick="mark(${i},1)">Present</button> <button class="btn sm red" onclick="mark(${i},0)">Absent</button> <button class="btn sm ghost" onclick="S.att.splice(${i},1);render()">🗑</button></span></div></div>`}).join(""):`<div class="empty">No subjects yet</div>`)+`
  <h2>➕ Add subject</h2><div class="card"><form onsubmit="addAtt(event)">
    <input name="n" placeholder="Subject name" required>
    <div class="grid"><input name="a" type="number" min="0" placeholder="Attended" value="0"><input name="t" type="number" min="0" placeholder="Total classes" value="0"></div>
    <button class="btn">Add subject</button></form></div>`;
}
function mark(i,p){const x=S.att[i];x.t++;if(p)x.a++;if(pct(x)<75)notify(`Low attendance in ${x.n}: ${pct(x)}%`);render()}
function addAtt(e){e.preventDefault();const f=e.target,a=+f.a.value||0,t=Math.max(+f.t.value||0,a);S.att.push({n:f.n.value.trim(),a,t});render()}

function assignments(){
  const list=S.asg.map((a,i)=>({...a,i})).filter(a=>ui.tab==="done"?a.done:!a.done).sort((a,b)=>a.d.localeCompare(b.d));
  $("assignments").innerHTML=`<div class="tabs"><div class="chip ${ui.tab==="pending"?"active":""}" onclick="ui.tab='pending';render()">Pending</div><div class="chip ${ui.tab==="done"?"active":""}" onclick="ui.tab='done';render()">Completed</div></div>`+
  (list.length?list.map(a=>`<div class="card ${a.done?"done":""}"><div class="row"><b class="title">${esc(a.t)}</b>${a.done?"":dueTag(a.d)}</div>
    <div class="muted">${esc(a.s)} · Due ${a.d}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm ${a.done?"ghost":"green"}" onclick="S.asg[${a.i}].done=!S.asg[${a.i}].done;render()">${a.done?"Undo":"✓ Mark done"}</button><button class="btn sm red" onclick="S.asg.splice(${a.i},1);render()">Delete</button></div></div>`).join(""):`<div class="empty">Nothing here</div>`)+`
  <h2>➕ Add assignment</h2><div class="card"><form onsubmit="addAsg(event)">
    <input name="t" placeholder="Assignment title" required><input name="s" placeholder="Subject" required>
    <input name="d" type="date" min="${fmt(new Date())}" value="${fmt(addDays(3))}" required><button class="btn">Add assignment</button></form></div>`;
}
function addAsg(e){e.preventDefault();const f=e.target;S.asg.push({t:f.t.value.trim(),s:f.s.value.trim(),d:f.d.value,done:false});notify(`New assignment "${f.t.value.trim()}" due ${f.d.value}`);ui.tab="pending";render()}

function timetable(){
  const list=S.tt.map((x,i)=>({...x,i})).filter(x=>x.day===ui.day).sort((a,b)=>a.time.localeCompare(b.time));
  $("timetable").innerHTML=`<div class="chips">${DAYS.map(d=>`<div class="chip ${ui.day===d?"active":""}" onclick="ui.day='${d}';render()">${d}</div>`).join("")}</div>`+
  (list.length?list.map(x=>`<div class="card row"><div><b>🕘 ${x.time}</b> · ${esc(x.sub)}<div class="muted">📍 ${esc(x.room)}</div></div><button class="btn sm ghost" onclick="S.tt.splice(${x.i},1);render()">🗑</button></div>`).join(""):`<div class="empty">No classes on ${ui.day}</div>`)+`
  <h2>➕ Add class</h2><div class="card"><form onsubmit="addTT(event)">
    <select name="day">${DAYS.map(d=>`<option ${d===ui.day?"selected":""}>${d}</option>`).join("")}</select>
    <input name="time" type="time" required value="09:00"><input name="sub" placeholder="Subject" required><input name="room" placeholder="Room / Lab" required>
    <button class="btn">Add to timetable</button></form></div>`;
}
function addTT(e){e.preventDefault();const f=e.target;S.tt.push({day:f.day.value,time:f.time.value,sub:f.sub.value.trim(),room:f.room.value.trim()});ui.day=f.day.value;render()}

function notifications(){
  $("notifications").innerHTML=`<div class="row" style="margin-bottom:10px"><span class="muted">${S.nt.filter(n=>!n.read).length} unread</span>
    <span><button class="btn sm ghost" onclick="S.nt.forEach(n=>n.read=true);render()">Mark all read</button> <button class="btn sm red" onclick="S.nt=[];render()">Clear</button></span></div>`+
  (S.nt.length?S.nt.map((n,i)=>`<div class="card ${n.read?"":"unread"}" onclick="S.nt[${i}].read=true;render()"><div>${n.read?"":"🔔 "}${esc(n.m)}</div><div class="muted">${n.time}</div></div>`).join(""):`<div class="empty">No notifications</div>`)+`
  <h2>➕ Post notice</h2><div class="card"><form onsubmit="event.preventDefault();notify(this.m.value.trim());render()">
    <textarea name="m" rows="2" placeholder="Type an academic announcement..." required></textarea><button class="btn">Send notification</button></form></div>`;
}
render();
</script>
</body>
</html>
